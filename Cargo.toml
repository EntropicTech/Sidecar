[workspace]
members = ["crates/core", "crates/daemon", "crates/cli", "crates/desktop"]
resolver = "2"
exclude = ["vendor/eframe-0.31.1"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/EntropicTech/Sidecar"
rust-version = "1.89"

[workspace.dependencies]
igpu-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
csv = "1"
libc = "0.2"
log = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Reviewed native-window retirement fix; see vendor/README.md.
[patch.crates-io]
eframe = { path = "vendor/eframe-0.31.1" }
